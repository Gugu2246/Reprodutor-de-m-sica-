name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar dependências
        run: npm install

      - name: Preparar arquivos do aplicativo
        run: |
          mkdir -p www
          cp index.html style.css script.js manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Adicionar Android
        run: npx cap add android

      - name: Sincronizar projeto
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: musica-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
